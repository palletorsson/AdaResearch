name: Release Gates

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  release-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run release gates (honors toggle file)
        run: |
          STRICT_FLAGS=""
          if [[ "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF_NAME" == release/* ]]; then
            STRICT_FLAGS="--require-all-gates-enabled"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ "$GITHUB_BASE_REF" == "main" || "$GITHUB_BASE_REF" == release/* ]]; then
              STRICT_FLAGS="--require-all-gates-enabled"
            fi
          fi

          python tools/run_release_gates.py \
            --max-grade-c -1 \
            --gate-toggles doc/reports/RELEASE_GATES_TOGGLES.json \
            $STRICT_FLAGS \
            --json-out "$RUNNER_TEMP/RELEASE_GATES.json" \
            --md-out "$RUNNER_TEMP/RELEASE_GATES.md"

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gates-report
          path: |
            ${{ runner.temp }}/RELEASE_GATES.json
            ${{ runner.temp }}/RELEASE_GATES.md
