# Read the Docs configuration for the Godot course site. AN EXAMPLE, NOT IN USE.
#
# Route A (build from the AdaResearch repository itself): copy this file to the repository
# root as .readthedocs.yaml, commit and push it. Read the Docs then installs the pinned
# requirements, runs build_site.py to generate docs/ from the course's files, and builds
# the site with mkdocs.yml. See README.md beside this file for the steps and for route B.
#
# Reference: https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # docs/ is generated and not committed: make it before MkDocs runs.
    pre_build:
      - python doc/book/course/site/build_site.py

mkdocs:
  configuration: doc/book/course/site/mkdocs.yml
  # build_site.py writes only pages mkdocs build --strict accepts; keep it that way.
  fail_on_warning: true

python:
  install:
    - requirements: doc/book/course/site/requirements.txt

# Route B (a small separate repository holding only the site): the same file, with these
