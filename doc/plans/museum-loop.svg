<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="ui-sans-serif,system-ui,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-end"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-end"><path d="M0,0 L10,5 L0,10 z" fill="#d1344b"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfaf8"/>
<text x="40" y="42" font-size="19" font-weight="600" fill="#141820">The museum loop</text>
<text x="40" y="64" font-size="12" fill="#5b6472">Two loops at two speeds. Each box is coloured by whether the tool it names exists.</text>
<rect x="40" y="80" width="11" height="11" rx="2" fill="#2e7d4f" fill-opacity="0.22" stroke="#2e7d4f" stroke-width="1.4"/>
<text x="57" y="90" font-size="10.5" fill="#5b6472">READY</text>
<rect x="101" y="80" width="11" height="11" rx="2" fill="#c07a12" fill-opacity="0.22" stroke="#c07a12" stroke-width="1.4"/>
<text x="118" y="90" font-size="10.5" fill="#5b6472">LIMITED</text>
<rect x="176" y="80" width="11" height="11" rx="2" fill="#8d949e" fill-opacity="0.22" stroke="#8d949e" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="193" y="90" font-size="10.5" fill="#5b6472">TO BUILD</text>
<text x="232" y="128" font-size="13" font-weight="600" fill="#141820" text-anchor="middle">FAST SURVEY</text>
<text x="232" y="145" font-size="11" fill="#5b6472" text-anchor="middle">every hall &#183; ~3 seconds &#183; fixes nothing</text>
<circle cx="232" cy="342" r="126" fill="none" stroke="#5b6472" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.5"/>
<circle cx="232.0" cy="216.0" r="30" fill="#c07a12" fill-opacity="0.16" stroke="#c07a12" stroke-width="1.8"/>
<text x="232.0" y="219.0" font-size="9.5" font-weight="600" fill="#141820" text-anchor="middle">REFRESH</text>
<text x="232.0" y="260.0" font-size="8.5" fill="#5b6472" text-anchor="middle">rebuild the caches</text>
<text x="232.0" y="271.0" font-size="8.5" fill="#5b6472" text-anchor="middle">or declare them stale</text>
<path d="M257.4,253.6 A92,92 0 0,1 290.6,271.1" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#a)"/>
<circle cx="351.8" cy="303.1" r="30" fill="#2e7d4f" fill-opacity="0.16" stroke="#2e7d4f" stroke-width="1.8"/>
<text x="351.8" y="306.1" font-size="9.5" font-weight="600" fill="#141820" text-anchor="middle">MEASURE</text>
<text x="351.8" y="347.1" font-size="8.5" fill="#5b6472" text-anchor="middle">7 columns per hall</text>
<text x="351.8" y="358.1" font-size="8.5" fill="#5b6472" text-anchor="middle">ACT needs a probe</text>
<path d="M323.9,338.9 A92,92 0 0,1 317.5,375.9" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#a)"/>
<circle cx="306.1" cy="443.9" r="30" fill="#2e7d4f" fill-opacity="0.16" stroke="#2e7d4f" stroke-width="1.8"/>
<text x="306.1" y="446.9" font-size="9.5" font-weight="600" fill="#141820" text-anchor="middle">DISCREPANCY</text>
<text x="306.1" y="487.9" font-size="8.5" fill="#5b6472" text-anchor="middle">the contradictions,</text>
<text x="306.1" y="498.9" font-size="8.5" fill="#5b6472" text-anchor="middle">not the totals</text>
<path d="M263.4,428.5 A92,92 0 0,1 226.2,433.8" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#a)"/>
<circle cx="157.9" cy="443.9" r="30" fill="#2e7d4f" fill-opacity="0.16" stroke="#2e7d4f" stroke-width="1.8"/>
<text x="157.9" y="446.9" font-size="9.5" font-weight="600" fill="#141820" text-anchor="middle">RANK</text>
<text x="157.9" y="487.9" font-size="8.5" fill="#5b6472" text-anchor="middle">consequence x uncertainty</text>
<text x="157.9" y="498.9" font-size="8.5" fill="#5b6472" text-anchor="middle">x test value</text>
<path d="M159.5,398.6 A92,92 0 0,1 142.9,364.9" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#a)"/>
<circle cx="112.2" cy="303.1" r="30" fill="#2e7d4f" fill-opacity="0.16" stroke="#2e7d4f" stroke-width="1.8"/>
<text x="112.2" y="306.1" font-size="9.5" font-weight="600" fill="#141820" text-anchor="middle">SELECT</text>
<text x="112.2" y="347.1" font-size="8.5" fill="#5b6472" text-anchor="middle">one falsifiable question</text>
<text x="112.2" y="358.1" font-size="8.5" fill="#5b6472" text-anchor="middle">about one hall</text>
<path d="M155.8,290.5 A92,92 0 0,1 182.7,264.3" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M372,342 C430,342 450,330 486,318" fill="none" stroke="#d1344b" stroke-width="2" marker-end="url(#ar)"/>
<text x="432" y="326" font-size="10" fill="#d1344b" text-anchor="middle" font-weight="600">one hall</text>
<text x="510" y="110" font-size="13" font-weight="600" fill="#141820">SLOW TURN</text>
<text x="606" y="110" font-size="11" fill="#5b6472">one hall &#183; most of a day &#183; does not scale</text>
<rect x="510" y="132" width="300" height="33" rx="4" fill="#8d949e" fill-opacity="0.14" stroke="#8d949e" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="521" y="152" font-size="10" font-weight="600" fill="#141820"> 1  CONTRACT</text>
<text x="660" y="152" font-size="9" fill="#5b6472">claim + prior lessons</text>
<rect x="510" y="170" width="300" height="33" rx="4" fill="#2e7d4f" fill-opacity="0.14" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="521" y="190" font-size="10" font-weight="600" fill="#141820"> 2  HYPOTHESIS</text>
<text x="660" y="190" font-size="9" fill="#5b6472">stated to be disproved</text>
<rect x="510" y="208" width="300" height="33" rx="4" fill="#2e7d4f" fill-opacity="0.14" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="521" y="228" font-size="10" font-weight="600" fill="#141820"> 3  READ</text>
<text x="660" y="228" font-size="9" fill="#5b6472">agents, .gd AND .tscn</text>
<rect x="510" y="246" width="300" height="33" rx="4" fill="#2e7d4f" fill-opacity="0.14" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="521" y="266" font-size="10" font-weight="600" fill="#141820"> 4  CROSS-CHECK</text>
<text x="660" y="266" font-size="9" fill="#5b6472">one adversary</text>
<rect x="510" y="284" width="300" height="33" rx="4" fill="#2e7d4f" fill-opacity="0.14" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="521" y="304" font-size="10" font-weight="600" fill="#141820"> 5  DRY RUN</text>
<text x="660" y="304" font-size="9" fill="#5b6472">plan, route, order</text>
<rect x="510" y="322" width="300" height="33" rx="4" fill="#c07a12" fill-opacity="0.14" stroke="#c07a12" stroke-width="1.5"/>
<text x="521" y="342" font-size="10" font-weight="600" fill="#141820"> 6  MUTATE</text>
<text x="660" y="342" font-size="9" fill="#5b6472">journalled</text>
<rect x="510" y="360" width="300" height="33" rx="4" fill="#c07a12" fill-opacity="0.14" stroke="#c07a12" stroke-width="1.5"/>
<text x="521" y="380" font-size="10" font-weight="600" fill="#141820"> 7  VERIFY</text>
<text x="660" y="380" font-size="9" fill="#5b6472">four media</text>
<rect x="510" y="398" width="300" height="33" rx="4" fill="#2e7d4f" fill-opacity="0.14" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="521" y="418" font-size="10" font-weight="600" fill="#141820"> 8  EVALUATE</text>
<text x="660" y="418" font-size="9" fill="#5b6472">against the hypothesis</text>
<rect x="510" y="436" width="300" height="33" rx="4" fill="#2e7d4f" fill-opacity="0.14" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="521" y="456" font-size="10" font-weight="600" fill="#141820"> 9  WRITE</text>
<text x="660" y="456" font-size="9" fill="#5b6472">one hand, after readers</text>
<rect x="510" y="474" width="300" height="33" rx="4" fill="#2e7d4f" fill-opacity="0.14" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="521" y="494" font-size="10" font-weight="600" fill="#141820">10  GATE</text>
<text x="660" y="494" font-size="9" fill="#5b6472">text space access act</text>
<rect x="510" y="512" width="300" height="33" rx="4" fill="#2e7d4f" fill-opacity="0.14" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="521" y="532" font-size="10" font-weight="600" fill="#141820">11  FINAL VERIFY</text>
<text x="660" y="532" font-size="9" fill="#5b6472">re-run VERIFY</text>
<rect x="510" y="550" width="300" height="33" rx="4" fill="#2e7d4f" fill-opacity="0.14" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="521" y="570" font-size="10" font-weight="600" fill="#141820">12  COMMIT / REVERT</text>
<text x="660" y="570" font-size="9" fill="#5b6472">seven outcomes</text>
<rect x="510" y="588" width="300" height="33" rx="4" fill="#c07a12" fill-opacity="0.14" stroke="#c07a12" stroke-width="1.5"/>
<text x="521" y="608" font-size="10" font-weight="600" fill="#141820">13  LESSON</text>
<text x="660" y="608" font-size="9" fill="#5b6472">evidence + a test</text>
<rect x="510" y="626" width="300" height="33" rx="4" fill="#2e7d4f" fill-opacity="0.14" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="521" y="646" font-size="10" font-weight="600" fill="#141820">14  REFRESH</text>
<text x="660" y="646" font-size="9" fill="#5b6472">the survey moved</text>
<path d="M816,566 C880,566 880,338 816,338" fill="none" stroke="#d1344b" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ar)"/>
<text x="892" y="452" font-size="9" fill="#d1344b" text-anchor="middle" transform="rotate(90 892 452)">revert</text>
<path d="M504,650 C430,650 300,500 232,526" fill="none" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a)"/>
<text x="360" y="670" font-size="9.5" fill="#5b6472" text-anchor="middle">the turn changed the survey&#8217;s inputs</text>
<rect x="860" y="150" width="278" height="112" rx="6" fill="none" stroke="#141820" stroke-width="1.5"/>
<text x="874" y="172" font-size="11.5" font-weight="600" fill="#141820">PROBE is a verb</text>
<text x="874" y="190" font-size="9.5" fill="#5b6472">Not a step. Any step whose output</text>
<text x="874" y="203" font-size="9.5" fill="#5b6472">another step will trust must be probed</text>
<text x="874" y="216" font-size="9.5" fill="#5b6472">before that trust is extended.</text>
<text x="874" y="229" font-size="9.5" fill="#5b6472"></text>
<text x="874" y="242" font-size="9.5" fill="#5b6472">286 probe_*.gd in the repo, and for a</text>
<text x="874" y="255" font-size="9.5" fill="#5b6472">year the loop had no place for one.</text>
<rect x="860" y="288" width="278" height="150" rx="6" fill="#d1344b" fill-opacity="0.05" stroke="#d1344b" stroke-width="1.5"/>
<text x="874" y="310" font-size="11.5" font-weight="600" fill="#141820">The engine is DISAGREEMENT</text>
<text x="874" y="328" font-size="9.5" fill="#5b6472">Every finding of consequence came from</text>
<text x="874" y="341" font-size="9.5" fill="#5b6472">TWO instruments contradicting each other,</text>
<text x="874" y="354" font-size="9.5" fill="#5b6472">never from one being run.</text>
<text x="874" y="367" font-size="9.5" fill="#5b6472"></text>
<text x="874" y="380" font-size="9.5" fill="#5b6472">registry 4 m vs code 5 m</text>
<text x="874" y="393" font-size="9.5" fill="#5b6472">intent “no floor” vs a catwalk</text>
<text x="874" y="406" font-size="9.5" fill="#5b6472">my max-flow vs networkx</text>
<text x="874" y="419" font-size="9.5" fill="#5b6472">greedy vs Hungarian (they AGREED,</text>
<text x="874" y="432" font-size="9.5" fill="#5b6472">   which refuted the prediction)</text>
<rect x="860" y="462" width="278" height="118" rx="6" fill="none" stroke="#2e7d4f" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="874" y="484" font-size="11.5" font-weight="600" fill="#141820">The visitor’s loop, which is not this</text>
<text x="874" y="502" font-size="9.5" fill="#5b6472">notice → predict → act</text>
<text x="874" y="514" font-size="9.5" fill="#5b6472">   → the algorithm answers → compare</text>
<text x="874" y="526" font-size="9.5" fill="#5b6472">   → leave a trace, or leave</text>
<text x="874" y="538" font-size="9.5" fill="#5b6472"></text>
<text x="874" y="550" font-size="9.5" fill="#5b6472">Never shown to a player. Everything</text>
<text x="874" y="562" font-size="9.5" fill="#5b6472">above is instrumentation for finding</text>
<text x="874" y="574" font-size="9.5" fill="#5b6472">out whether this closes.</text>
<text x="40" y="738" font-size="9.5" fill="#5b6472">Generated from doc/MUSEUM_LOOP.md. Statuses are the document’s own, and exist because for one day it described the survey it wanted rather than the one that ran.</text>
</svg>
