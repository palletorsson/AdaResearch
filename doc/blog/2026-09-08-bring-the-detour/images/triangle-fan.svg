<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Same boundary, different first point</title>
<desc id="desc">Triangle fans on the six coordinates of an L-shaped outline. Starting at A fills the intended region. Starting at B produces triangles extending into the notch.</desc>
<rect width="1100" height="620" fill="#f4f0e8"/>
<g font-family="Arial, sans-serif" fill="#20252b">
<text x="52" y="53" font-size="28" font-weight="bold">Same boundary. Four triangles in each run.</text>
<text x="90" y="108" font-size="24">Begin at A</text>
<polygon points="90.0,490.0 426.0,490.0 426.0,378.0" fill="#35998e" fill-opacity="0.55" stroke="#35998e" stroke-width="2"/>
<polygon points="90.0,490.0 426.0,378.0 202.0,378.0" fill="#5eb4a8" fill-opacity="0.55" stroke="#5eb4a8" stroke-width="2"/>
<polygon points="90.0,490.0 202.0,378.0 202.0,154.0" fill="#bd5e93" fill-opacity="0.55" stroke="#bd5e93" stroke-width="2"/>
<polygon points="90.0,490.0 202.0,154.0 90.0,154.0" fill="#e58c48" fill-opacity="0.55" stroke="#e58c48" stroke-width="2"/>
<polygon points="90.0,490.0 426.0,490.0 426.0,378.0 202.0,378.0 202.0,154.0 90.0,154.0" fill="none" stroke="#20252b" stroke-width="4"/>
<circle cx="90" cy="490" r="7" fill="#20252b"/>
<text x="68" y="514" font-size="20" font-weight="bold">A</text>
<circle cx="426.0" cy="490" r="4" fill="#20252b"/>
<text x="436.0" y="514" font-size="20" font-weight="bold">B</text>
<circle cx="426.0" cy="378.0" r="4" fill="#20252b"/>
<text x="438.0" y="378.0" font-size="20" font-weight="bold">C</text>
<circle cx="202.0" cy="378.0" r="4" fill="#20252b"/>
<text x="212.0" y="365.0" font-size="20" font-weight="bold">D</text>
<circle cx="202.0" cy="154.0" r="4" fill="#20252b"/>
<text x="212.0" y="154.0" font-size="20" font-weight="bold">E</text>
<circle cx="90" cy="154.0" r="4" fill="#20252b"/>
<text x="68" y="142.0" font-size="20" font-weight="bold">F</text>
<text x="70" y="557" font-size="19">The fan stays inside the outline.</text>
<text x="630" y="108" font-size="24">Begin at B</text>
<polygon points="966.0,490.0 966.0,378.0 742.0,378.0" fill="#35998e" fill-opacity="0.55" stroke="#35998e" stroke-width="2"/>
<polygon points="966.0,490.0 742.0,378.0 742.0,154.0" fill="#5eb4a8" fill-opacity="0.55" stroke="#5eb4a8" stroke-width="2"/>
<polygon points="966.0,490.0 742.0,154.0 630.0,154.0" fill="#bd5e93" fill-opacity="0.55" stroke="#bd5e93" stroke-width="2"/>
<polygon points="966.0,490.0 630.0,154.0 630.0,490.0" fill="#e58c48" fill-opacity="0.55" stroke="#e58c48" stroke-width="2"/>
<polygon points="630.0,490.0 966.0,490.0 966.0,378.0 742.0,378.0 742.0,154.0 630.0,154.0" fill="none" stroke="#20252b" stroke-width="4"/>
<circle cx="630" cy="490" r="4" fill="#20252b"/>
<text x="608" y="514" font-size="20" font-weight="bold">A</text>
<circle cx="966.0" cy="490" r="7" fill="#20252b"/>
<text x="976.0" y="514" font-size="20" font-weight="bold">B</text>
<circle cx="966.0" cy="378.0" r="4" fill="#20252b"/>
<text x="978.0" y="378.0" font-size="20" font-weight="bold">C</text>
<circle cx="742.0" cy="378.0" r="4" fill="#20252b"/>
<text x="752.0" y="365.0" font-size="20" font-weight="bold">D</text>
<circle cx="742.0" cy="154.0" r="4" fill="#20252b"/>
<text x="752.0" y="154.0" font-size="20" font-weight="bold">E</text>
<circle cx="630" cy="154.0" r="4" fill="#20252b"/>
<text x="608" y="142.0" font-size="20" font-weight="bold">F</text>
<text x="610" y="557" font-size="19">The fan extends into the missing notch.</text>
<text x="52" y="598" font-size="15" fill="#59616b">Diagram from the book experiment: 1.2 m outer square, 0.4 m arms. Coloured regions are the submitted triangles.</text>
</g></svg>