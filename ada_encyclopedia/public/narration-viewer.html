<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narration Viewer | Ada Research</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3a;
    --text: #e0e0e8;
    --text-dim: #8888a0;
    --accent-pink: #E91E63;
    --accent-blue: #4A90D9;
    --accent-purple: #9B59B6;
    --accent-green: #2ECC71;
    --accent-orange: #F39C12;
    --accent-red: #E74C3C;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    line-height: 1.6;
  }

  /* Layout */
  .app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; }
  .main { overflow-y: auto; padding: 1.5rem 2rem; }

  /* Header */
  .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border); }
  .sidebar-header h1 { font-size: 1.1rem; color: var(--accent-pink); }
  .sidebar-header .subtitle { font-size: 0.8rem; color: var(--text-dim); }

  /* Stats bar */
  .stats-bar { display: flex; gap: 0.5rem; padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .stat-chip { background: var(--surface2); padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.75rem; }
  .stat-chip.ok { color: var(--accent-green); }
  .stat-chip.issues { color: var(--accent-orange); }
  .stat-chip.critical { color: var(--accent-red); }

  /* Sequence list */
  .seq-item { padding: 0.6rem 1rem; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.15s; }
  .seq-item:hover { background: var(--surface2); }
  .seq-item.active { background: var(--surface2); border-left: 3px solid var(--accent-blue); }
  .seq-name { font-size: 0.9rem; font-weight: 600; }
  .seq-meta { font-size: 0.75rem; color: var(--text-dim); }
  .seq-badge { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 8px; font-size: 0.7rem; margin-left: 0.3rem; }
  .seq-badge.ok { background: rgba(46,204,113,0.15); color: var(--accent-green); }
  .seq-badge.issues { background: rgba(243,156,18,0.15); color: var(--accent-orange); }

  /* Map list */
  .map-list { margin-top: 0.5rem; }
  .map-item { padding: 0.4rem 1rem 0.4rem 1.5rem; cursor: pointer; font-size: 0.85rem; transition: background 0.15s; display: flex; justify-content: space-between; align-items: center; }
  .map-item:hover { background: var(--surface2); }
  .map-item.active { color: var(--accent-blue); font-weight: 600; }
  .map-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .map-status.ok { background: var(--accent-green); }
  .map-status.issues { background: var(--accent-orange); }
  .map-status.critical { background: var(--accent-red); }

  /* Run controls */
  .run-controls { padding: 0.8rem 1rem; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--surface); }
  .run-btn { width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface2); color: var(--text); cursor: pointer; font-size: 0.85rem; transition: all 0.15s; margin-bottom: 0.4rem; }
  .run-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
  .run-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .run-btn.running { border-color: var(--accent-orange); color: var(--accent-orange); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

  /* Main content */
  .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); font-size: 1.1rem; }
  .map-header { margin-bottom: 1.5rem; }
  .map-header h2 { font-size: 1.5rem; color: var(--accent-pink); }
  .map-header .map-path { font-size: 0.85rem; color: var(--text-dim); }

  /* Tabs */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
  .tab { padding: 0.6rem 1.2rem; cursor: pointer; font-size: 0.9rem; color: var(--text-dim); border-bottom: 2px solid transparent; transition: all 0.15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }

  /* Walkthrough */
  .walkthrough { font-family: 'Consolas', 'Courier New', monospace; }
  .walk-stop { background: var(--surface); padding: 1rem; border-radius: 6px; margin-bottom: 0.8rem; border-left: 3px solid var(--accent-blue); }
  .walk-stop.spawn { border-left-color: var(--accent-green); }
  .walk-stop.teleporter { border-left-color: var(--accent-purple); }
  .walk-stop .stop-header { font-weight: 600; margin-bottom: 0.3rem; }
  .walk-stop .stop-detail { font-size: 0.85rem; color: var(--text-dim); }
  .walk-stop .visible-list { font-size: 0.85rem; margin-top: 0.3rem; }
  .walk-stop .visible-item { color: var(--accent-green); }

  /* Issues */
  .issue-item { background: var(--surface); padding: 0.8rem 1rem; border-radius: 6px; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.8rem; }
  .issue-severity { padding: 0.15rem 0.5rem; border-radius: 8px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
  .issue-severity.critical { background: rgba(231,76,60,0.2); color: var(--accent-red); }
  .issue-severity.high { background: rgba(243,156,18,0.2); color: var(--accent-orange); }
  .issue-severity.low { background: rgba(136,136,160,0.15); color: var(--text-dim); }

  /* Spatial summary */
  .spatial-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.8rem; margin-bottom: 1.5rem; }
  .spatial-card { background: var(--surface); padding: 1rem; border-radius: 6px; border: 1px solid var(--border); }
  .spatial-card .label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 0.3rem; }
  .spatial-card .value { font-size: 1.4rem; font-weight: 600; }

  /* Artifact list */
  .artifact-item { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
  .artifact-name { font-weight: 500; }
  .artifact-pos { font-size: 0.8rem; color: var(--text-dim); font-family: monospace; }
  .artifact-reachable { font-size: 0.75rem; }
  .artifact-reachable.yes { color: var(--accent-green); }
  .artifact-reachable.no { color: var(--accent-red); }

  /* Journey summary */
  .journey-summary { background: var(--surface); padding: 1.2rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid var(--border); }
  .journey-summary p { margin-bottom: 0.3rem; font-size: 0.9rem; }

  /* Progress bar */
  .progress-bar { height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin-top: 0.5rem; }
  .progress-fill { height: 100%; background: var(--accent-blue); transition: width 0.3s; }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>Narration Viewer</h1>
      <div class="subtitle">Ada Research Map Walk-Through</div>
    </div>
    <div class="stats-bar" id="stats-bar">
      <span class="stat-chip">Loading...</span>
    </div>
    <div id="sequence-list"></div>
    <div class="run-controls">
      <button class="run-btn" id="btn-run-selected" disabled onclick="runNarration('sequence')">Narrate Selected Sequence</button>
      <button class="run-btn" id="btn-run-all" onclick="runNarration('all')">Narrate All Maps</button>
      <div class="progress-bar" id="run-progress" style="display:none"><div class="progress-fill" id="run-progress-fill"></div></div>
      <div id="run-status" style="font-size:0.75rem;color:var(--text-dim);margin-top:0.3rem;"></div>
    </div>
  </div>

  <!-- Main content -->
  <div class="main" id="main-content">
    <div class="empty-state">Select a sequence and map to view narration</div>
  </div>
</div>

<script>
const API_BASE = window.location.origin;
let reportData = null;
let selectedSequence = null;
let selectedMap = null;
let currentTab = 'walkthrough';
let runId = null;
let pollTimer = null;

// Load report on page load
async function loadReport() {
  try {
    const res = await fetch(`${API_BASE}/api/game/narration-report`);
    if (!res.ok) {
      document.getElementById('stats-bar').innerHTML = '<span class="stat-chip critical">No report found — run narration first</span>';
      return;
    }
    reportData = await res.json();
    renderSidebar();
  } catch (err) {
    document.getElementById('stats-bar').innerHTML = `<span class="stat-chip critical">Error: ${err.message}</span>`;
  }
}

function renderSidebar() {
  if (!reportData) return;
  const stats = reportData.statistics || {};
  const sequences = reportData.sequences || [];

  // Stats bar
  const statsBar = document.getElementById('stats-bar');
  const total = stats.narrated || 0;
  const issues = stats.maps_with_issues || 0;
  const clean = total - issues;
  statsBar.innerHTML = `
    <span class="stat-chip ok">${clean} clean</span>
    <span class="stat-chip issues">${issues} with issues</span>
    <span class="stat-chip">${total} total maps</span>
  `;

  // Sequence list
  const seqList = document.getElementById('sequence-list');
  seqList.innerHTML = '';
  for (const seq of sequences) {
    const seqIssues = (seq.maps || []).reduce((sum, m) => sum + (m.issues || []).length, 0);
    const seqEl = document.createElement('div');
    seqEl.className = `seq-item${selectedSequence === seq.name ? ' active' : ''}`;
    seqEl.innerHTML = `
      <div class="seq-name">${seq.name}
        <span class="seq-badge ${seqIssues > 0 ? 'issues' : 'ok'}">${seqIssues > 0 ? seqIssues + ' issues' : 'OK'}</span>
      </div>
      <div class="seq-meta">${(seq.maps || []).length} maps</div>
    `;
    seqEl.onclick = () => selectSequence(seq.name);
    seqList.appendChild(seqEl);

    // Map list (if sequence is selected)
    if (selectedSequence === seq.name) {
      const mapList = document.createElement('div');
      mapList.className = 'map-list';
      for (const map of (seq.maps || [])) {
        const mapIssues = (map.issues || []).length;
        const hasCritical = (map.issues || []).some(i => i.severity === 'critical');
        const statusClass = hasCritical ? 'critical' : mapIssues > 0 ? 'issues' : 'ok';
        const mapEl = document.createElement('div');
        mapEl.className = `map-item${selectedMap === map.map_name ? ' active' : ''}`;
        mapEl.innerHTML = `
          <span>${map.map_name}</span>
          <span class="map-status ${statusClass}"></span>
        `;
        mapEl.onclick = (e) => { e.stopPropagation(); selectMap(seq.name, map.map_name); };
        mapList.appendChild(mapEl);
      }
      seqList.appendChild(mapList);
    }
  }

  // Enable run button
  document.getElementById('btn-run-selected').disabled = !selectedSequence;
}

function selectSequence(name) {
  selectedSequence = selectedSequence === name ? null : name;
  selectedMap = null;
  document.getElementById('btn-run-selected').disabled = !selectedSequence;
  if (selectedSequence) {
    document.getElementById('btn-run-selected').textContent = `Narrate ${selectedSequence}`;
  }
  renderSidebar();
}

async function selectMap(seqName, mapName) {
  selectedSequence = seqName;
  selectedMap = mapName;
  renderSidebar();
  await loadMapDetail(seqName, mapName);
}

async function loadMapDetail(seqName, mapName) {
  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="empty-state">Loading narration data...</div>';

  try {
    const res = await fetch(`${API_BASE}/api/game/narration?sequence=${seqName}&map=${mapName}`);
    if (!res.ok) {
      main.innerHTML = `<div class="empty-state">No narration data for ${seqName}/${mapName}</div>`;
      return;
    }
    const data = await res.json();
    renderMapDetail(data);
  } catch (err) {
    main.innerHTML = `<div class="empty-state">Error: ${err.message}</div>`;
  }
}

function renderMapDetail(data) {
  const main = document.getElementById('main-content');
  const spatial = data.spatial || {};
  const journey = data.journey || {};
  const walkthrough = data.walkthrough || {};
  const issues = journey.issues || [];
  const artifacts = journey.artifacts || [];

  main.innerHTML = `
    <div class="map-header">
      <h2>${data.map_name || 'Unknown Map'}</h2>
      <div class="map-path">${data.sequence || ''} / ${data.map_name || ''} &mdash; ${data.timestamp || ''}</div>
    </div>

    <div class="tabs">
      <div class="tab ${currentTab === 'walkthrough' ? 'active' : ''}" onclick="switchTab('walkthrough')">Walk-Through</div>
      <div class="tab ${currentTab === 'spatial' ? 'active' : ''}" onclick="switchTab('spatial')">Spatial</div>
      <div class="tab ${currentTab === 'issues' ? 'active' : ''}" onclick="switchTab('issues')">Issues (${issues.length})</div>
      <div class="tab ${currentTab === 'artifacts' ? 'active' : ''}" onclick="switchTab('artifacts')">Artifacts (${artifacts.length})</div>
    </div>

    <div id="tab-content"></div>
  `;

  renderTabContent(data);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent.toLowerCase().startsWith(tab)));
  // Re-render tab content with stored data
  const main = document.getElementById('main-content');
  const tabs = main.querySelectorAll('.tab');
  tabs.forEach(t => {
    t.classList.remove('active');
    if (t.onclick.toString().includes(`'${tab}'`)) t.classList.add('active');
  });

  // Reload map detail to refresh tab
  if (selectedSequence && selectedMap) {
    loadMapDetail(selectedSequence, selectedMap);
  }
}

function renderTabContent(data) {
  const container = document.getElementById('tab-content');
  if (!container) return;

  const spatial = data.spatial || {};
  const journey = data.journey || {};
  const walkthrough = data.walkthrough || {};
  const issues = journey.issues || [];
  const artifacts = journey.artifacts || [];

  switch (currentTab) {
    case 'walkthrough':
      renderWalkthrough(container, walkthrough, journey);
      break;
    case 'spatial':
      renderSpatial(container, spatial);
      break;
    case 'issues':
      renderIssues(container, issues);
      break;
    case 'artifacts':
      renderArtifacts(container, artifacts);
      break;
  }
}

function renderWalkthrough(container, walkthrough, journey) {
  const stops = walkthrough.stops || [];
  const summary = walkthrough.summary || {};

  if (stops.length === 0) {
    container.innerHTML = '<div class="empty-state" style="height:200px">No walkthrough data available</div>';
    return;
  }

  let html = `
    <div class="journey-summary">
      <p><strong>${summary.total_steps || 0}</strong> total steps &bull; <strong>${summary.artifacts_visited || 0}</strong> artifacts visited &bull; <strong>${summary.total_stops || 0}</strong> stops</p>
    </div>
    <div class="walkthrough">
  `;

  for (let i = 0; i < stops.length; i++) {
    const stop = stops[i];
    const typeClass = stop.type === 'spawn' ? 'spawn' : stop.type === 'teleporter' ? 'teleporter' : '';

    html += `<div class="walk-stop ${typeClass}">`;

    if (stop.type === 'spawn') {
      html += `<div class="stop-header">${i + 1}. Spawn at (${stop.pos.join(',')}) — facing ${stop.facing}</div>`;
      if (stop.visible && stop.visible.length > 0) {
        html += '<div class="visible-list">I can see: ';
        html += stop.visible.map(v => `<span class="visible-item">${v.name}</span> (${v.dist} steps ${v.direction})`).join(', ');
        html += '</div>';
      } else {
        html += '<div class="stop-detail">Nothing visible from here</div>';
      }
    } else if (stop.type === 'artifact') {
      html += `<div class="stop-header">${i + 1}. Walk ${stop.steps_from_prev} steps ${stop.approach_from} → ${stop.name} at (${stop.pos.join(',')})</div>`;
      if (stop.visible_others && stop.visible_others.length > 0) {
        html += '<div class="visible-list">Looking around: ';
        html += stop.visible_others.map(v => `<span class="visible-item">${v.name}</span> (${v.dist} steps ${v.direction})`).join(', ');
        html += '</div>';
      } else {
        html += '<div class="stop-detail">Nothing else visible from here</div>';
      }
    } else if (stop.type === 'teleporter') {
      if (stop.reachable) {
        html += `<div class="stop-header">${i + 1}. Walk ${stop.steps_from_prev} steps ${stop.approach_from} → Teleporter at (${stop.pos.join(',')})</div>`;
      } else {
        html += `<div class="stop-header">${i + 1}. Teleporter at (${stop.pos.join(',')}) — UNREACHABLE</div>`;
      }
    }

    html += `<div class="stop-detail">Total: ${stop.total_steps} steps walked</div>`;
    html += '</div>';
  }

  html += '</div>';
  container.innerHTML = html;
}

function renderSpatial(container, spatial) {
  const dims = spatial.dimensions || [0, 0, 0];
  const height = spatial.height || {};
  const rooms = spatial.rooms || [];
  const spawn = spatial.spawn;
  const teleporter = spatial.teleporter;

  let html = `
    <div class="spatial-grid">
      <div class="spatial-card"><div class="label">Dimensions</div><div class="value">${dims[0]}x${dims[2]}</div></div>
      <div class="spatial-card"><div class="label">Ground Tiles</div><div class="value">${height.ground || 0} <small>(${(height.ground_pct || 0).toFixed(0)}%)</small></div></div>
      <div class="spatial-card"><div class="label">Walls</div><div class="value">${height.walls || 0}</div></div>
      <div class="spatial-card"><div class="label">Void</div><div class="value">${height.void || 0}</div></div>
      <div class="spatial-card"><div class="label">Rooms</div><div class="value">${rooms.length}</div></div>
      <div class="spatial-card"><div class="label">Artifacts</div><div class="value">${(spatial.artifacts || []).length}</div></div>
    </div>
  `;

  if (spawn) html += `<p>Spawn: (${spawn.join(',')})</p>`;
  if (teleporter) html += `<p>Teleporter: (${teleporter.join(',')})</p>`;

  if (rooms.length > 0) {
    html += '<h3 style="color:var(--accent-purple);margin:1.5rem 0 0.5rem">Rooms</h3>';
    for (const room of rooms) {
      html += `<div style="margin-bottom:0.3rem"><strong>Room ${room.label}</strong> (${room.region}) — ${room.tiles} tiles${room.artifacts.length > 0 ? ' — ' + room.artifacts.join(', ') : ''}</div>`;
    }
  }

  container.innerHTML = html;
}

function renderIssues(container, issues) {
  if (issues.length === 0) {
    container.innerHTML = '<div class="empty-state" style="height:200px;color:var(--accent-green)">No issues found</div>';
    return;
  }

  let html = '';
  // Sort: critical first, then high, then low
  const sorted = [...issues].sort((a, b) => {
    const order = { critical: 0, high: 1, low: 2 };
    return (order[a.severity] || 3) - (order[b.severity] || 3);
  });

  for (const issue of sorted) {
    html += `
      <div class="issue-item">
        <span class="issue-severity ${issue.severity || 'low'}">${issue.severity || 'low'}</span>
        <span>${issue.description || issue.type}</span>
      </div>
    `;
  }
  container.innerHTML = html;
}

function renderArtifacts(container, artifacts) {
  if (artifacts.length === 0) {
    container.innerHTML = '<div class="empty-state" style="height:200px">No artifacts in this map</div>';
    return;
  }

  let html = '';
  for (const art of artifacts) {
    const reachable = art.reachable !== false;
    html += `
      <div class="artifact-item">
        <div>
          <span class="artifact-name">${art.name}</span>
          <span class="artifact-pos">(${(art.pos || []).join(',')})</span>
        </div>
        <div>
          ${art.dist >= 0 ? `<span style="color:var(--text-dim);font-size:0.8rem">${art.dist} steps</span>` : ''}
          <span class="artifact-reachable ${reachable ? 'yes' : 'no'}">${reachable ? 'reachable' : 'unreachable'}</span>
        </div>
      </div>
    `;
  }
  container.innerHTML = html;
}

// Run narration
async function runNarration(target) {
  const body = { target };
  if (target === 'sequence' && selectedSequence) {
    body.sequence = selectedSequence;
  }

  const btn = target === 'all' ? document.getElementById('btn-run-all') : document.getElementById('btn-run-selected');
  btn.classList.add('running');
  btn.disabled = true;
  btn.textContent = 'Starting...';

  document.getElementById('run-progress').style.display = 'block';
  document.getElementById('run-status').textContent = 'Starting Godot...';

  try {
    const res = await fetch(`${API_BASE}/api/game/narrate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.id) {
      runId = data.id;
      pollRunStatus(btn);
    } else {
      btn.classList.remove('running');
      btn.disabled = false;
      btn.textContent = target === 'all' ? 'Narrate All Maps' : `Narrate ${selectedSequence}`;
      document.getElementById('run-status').textContent = `Error: ${data.error || 'Unknown'}`;
    }
  } catch (err) {
    btn.classList.remove('running');
    btn.disabled = false;
    document.getElementById('run-status').textContent = `Error: ${err.message}`;
  }
}

function pollRunStatus(btn) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const res = await fetch(`${API_BASE}/api/game/narrate?id=${runId}`);
      const data = await res.json();

      const statusEl = document.getElementById('run-status');
      const lastLine = (data.output || []).filter(l => l.startsWith('[')).pop() || '';
      statusEl.textContent = lastLine;

      if (!data.running) {
        clearInterval(pollTimer);
        pollTimer = null;
        btn.classList.remove('running');
        btn.disabled = false;
        btn.textContent = btn.id === 'btn-run-all' ? 'Narrate All Maps' : `Narrate ${selectedSequence || 'Selected'}`;
        document.getElementById('run-progress').style.display = 'none';
        statusEl.textContent = 'Done! Reloading report...';
        // Reload report data
        await loadReport();
        // Re-select current map if any
        if (selectedSequence && selectedMap) {
          await loadMapDetail(selectedSequence, selectedMap);
        }
        statusEl.textContent = 'Complete';
      }
    } catch (err) {
      document.getElementById('run-status').textContent = `Poll error: ${err.message}`;
    }
  }, 2000);
}

// Initialize
loadReport();
</script>
</body>
</html>
